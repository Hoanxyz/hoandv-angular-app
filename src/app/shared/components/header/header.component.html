<div class="font-mali sticky top-0 z-20 beautiful-bg">
  <div class="py-1 text-white">
    <div class="flex justify-between items-center relative max-w-screen-xl mx-auto md:py-4 px-3 md:px-5 lg:px-8">
      <div>
        <button class="flex" (click)="toggleSearch()">
          <mat-icon class="scale-125 text-white">search</mat-icon>
        </button>
      </div>
      <div class="absolute custom-item-center">
        <h1 class="text-2xl md:text-4xl lg:text-5xl text-center font-semibold whitespace-nowrap">
          <span class="inline-block cursor-pointer" (click)="changeLocation(logoLink)">
            {{title}}
          </span>
        </h1>
      </div>
      <div>
        <div class="flex items-center" *ngIf="user; else loginBlock">
          <div class="mr-2 hidden md:block">
            <span class="font-semibold">Hellu {{user?.lastname ? user?.lastname : user?.username}}</span>
          </div>
          <div>
            <button [matMenuTriggerFor]="menu" mat-icon-button class="example-icon !flex items-center justify-between">
              <mat-icon>menu</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <ng-container *ngFor="let url of listUrls">
                <button mat-menu-item (click)="changeLocation(url.url)">
                  <mat-icon>{{url.icon}}</mat-icon>
                  <span>{{url.title}}</span>
                </button>
              </ng-container>
              <button mat-menu-item (click)="logout()">
                <mat-icon>exit_to_app</mat-icon>
                <span>Đăng xuất</span>
              </button>
            </mat-menu>
          </div>
        </div>
        <ng-template #loginBlock>
          <div class="font-semibold cursor-pointer py-4" (click)="changeLocation(logoutRedirect)">Login</div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
