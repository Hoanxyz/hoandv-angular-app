<form action="" [formGroup]="formData">
  <app-input-money [control]="formData.controls['money']" [separate]="','" [currency]="'USD'"></app-input-money>
</form>

<form [formGroup]="form">
  <app-choose-quantity [increment]="10" formControlName="totalQuantity"></app-choose-quantity>
  <div>
    {{form.controls['totalQuantity']}}
  </div>
</form>
