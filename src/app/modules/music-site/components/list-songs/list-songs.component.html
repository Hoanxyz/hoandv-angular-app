<app-header-music></app-header-music>
<div class="pt-8 mb-2 md:mb-0 max-w-screen-xl px-3 md:px-5 lg:px-8 mx-auto font-mali">
  <div class="mb-8 lg:mb-10 border-b border-neutral-700 md:border-0 relative">
    <div class="md:flex">
      <div class="md:w-1/2 mb-8 md:mb-0 border-b border-neutral-700 md:border-0">
        <div class="mb-8">
          <div class="flex items-center mb-4 lg:mb-8">
            <h2 class="text-2xl md:text-3xl font-semibold mr-8">All Songs</h2>
          </div>
          <app-song-table [pageAble]="pageAble" [playFromList]="listPlay.ALL"></app-song-table>
        </div>
      </div>
      <div class="md:w-1/2 md:pl-10 lg:pl-20">
        <app-favorite-list></app-favorite-list>
      </div>
    </div>
  </div>
  <div class="flex items-center">
    <input class="max-w-60" type="file" (change)="onFileSelected($event)" accept=".mp3, .m4a, .flac">
    <button class="!w-10 !h-10" mat-fab color="accent" (click)="onUpload()" [disabled]="!selectedFile"
            aria-label="Upload song (mp3 and m4a only)">
      <mat-icon>upload</mat-icon>
    </button>
  </div>
</div>
