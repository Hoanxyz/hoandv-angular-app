<div>
  <app-header-music></app-header-music>
  <div class="max-w-screen-xl px-3 md:px-5 lg:px-8 mx-auto font-mali my-8">
    <div class="mb-8 lg:mb-10 border-b border-neutral-700 md:border-0 relative">
      <div class="md:flex">
        <div class="md:w-1/2 mb-8 md:mb-0 border-b border-neutral-700 md:border-0 md:pr-10 lg:pr-20">
          <div class="mb-8">
            <div class="flex items-center mb-4 lg:mb-8">
              <h2 class="text-2xl md:text-3xl font-semibold mr-8 text-center w-full">All Songs</h2>
            </div>
            <app-song-table [pageAble]="pageAble" [playFromList]="listPlay"></app-song-table>
          </div>
        </div>
        <div class="md:w-1/2 md:pl-10 lg:pl-20">
          <mat-tab-group>
            <mat-tab label="Your Favorite Songs">
              <app-favorite-list></app-favorite-list>
            </mat-tab>
            <mat-tab label="Your Song Collections">
              <div class="p-3">
                <app-song-collections></app-song-collections>
              </div>
            </mat-tab>
          </mat-tab-group>
        </div>
      </div>
    </div>
    <div class="" [formGroup]="formUpload">
      <div class="mb-2">Bạn có thể tự upload bài hát hoặc liên hệ Hoàn để update bất cứ bài hát nào nhe</div>
      <div class="flex w-fit items-center">
        <div class="mr-3">
          <div class="flex items-center relative w-max rounded border p-2"
               [ngClass]="formUpload.invalid && formUpload.touched ? 'border-red-500' : 'border-gray-300'">
            <mat-icon class="text-blue-500" style="font-size: 30px; height: 30px; width: 30px">library_music</mat-icon>
            <div class="flex-grow-1 w-60 mx-2">
              <div class="whitespace-nowrap text-ellipsis overflow-hidden"
                   *ngIf="formUpload.get('name')?.value;else uploadInputLabelElse">
                {{ formUpload.get('name')?.value}}
              </div>
              <ng-template #uploadInputLabelElse>
                <div class="file-label">File không quá 15MB</div>
              </ng-template>
            </div>
            <input type="file" class="" style="position: absolute;width: 40px;opacity: 0;right: 0;z-index: 1;"
                   #uploadSong id="inputGroupFile" accept=".mp3, .mp4, .flag"
                   aria-describedby="inputExcelFile" (change)="onInputExcelFilePicked($event, uploadSong)" />
            <mat-icon class="text-blue-500" style="font-size: 36px; height: 36px; width: 36px; z-index: 0">cloud_upload</mat-icon>
          </div>
        </div>
        <button class="!w-10 !h-10" mat-fab color="primary" (click)="onUpload()" [disabled]="!selectedFile || !formUpload.valid"
                aria-label="Upload song (mp3 and m4a only)">
          <mat-icon>upload</mat-icon>
        </button>
      </div>
      <div class="mt-1" *ngIf="formUpload.invalid && formUpload.touched">
        <mat-error *ngIf="formUpload.errors?.['fileSize']">Upload file be bé thôi.</mat-error>
        <mat-error *ngIf="formUpload.errors?.['invalidFormat']">Nhầm loại file rồi bạn ơi.</mat-error>
      </div>
    </div>
  </div>
</div>
